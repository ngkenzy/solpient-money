services:
  postgres:
    image: postgres:17-alpine
    container_name: solpient-money-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: solpient
      POSTGRES_USER: solpient
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - solpient_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solpient -d solpient"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  solpient_postgres_data:
    name: solpient_postgres_data
