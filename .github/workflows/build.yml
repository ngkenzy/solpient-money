name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run test:research
      - run: npm run test:money
      - run: npm run test:v04
      - run: npm run test:v05
      - run: npm run test:v06
      - run: npm run test:v061
      - run: npm run build
