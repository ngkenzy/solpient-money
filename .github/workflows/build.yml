name: Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feature/tsp-csv-first-v19

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: solpient
          POSTGRES_USER: solpient
          POSTGRES_PASSWORD: solpient_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solpient -d solpient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Apply Solpient schema to plain PostgreSQL 17
        run: npm run local:migrate
        env:
          DATABASE_URL: postgresql://solpient:solpient_ci@127.0.0.1:5432/solpient
      - name: Verify live PostgreSQL schema
        run: node scripts/test-local-db-live.mjs
        env:
          DATABASE_URL: postgresql://solpient:solpient_ci@127.0.0.1:5432/solpient
      - run: npm run lint
      - run: npm run test:money
      - run: npm run test:local
      - run: npm run test:v04
      - run: npm run test:v05
      - run: npm run test:connect-v11
      - run: npm run test:v09
      - run: npm run test:v091
      - run: npm run test:v092
      - run: npm run test:v11
      - run: npm run test:v12
      - run: npm run test:v121
      - run: npm run test:v122
      - run: npm run test:v123
      - run: npm run test:v15
      - run: npm run test:v17
      - run: npm run test:v171
      - run: npm run test:v173
      - run: npm run test:v174
      - run: npm run test:v175
      - run: npm run test:v18
      - run: npm run test:v19
      - run: npm run test:v20
      - run: npm run test:v201
      - run: npm run test:v202
      - run: npm run test:v204
      - run: npm run test:v205
      - run: npm run test:v206
      - run: npm run test:v207
      - run: npm run test:v208
      - run: npm run test:v209
      - run: npm run test:v210
      - run: npm run test:v212
      - run: npm run test:v213
      - run: npm run test:v214
      - run: npm run test:v215
      - run: npm run test:v216
      - run: npm run test:v219
      - run: npm run test:v220
      - run: npm run test:v221
      - run: npm run test:v222
      - run: npm run build
